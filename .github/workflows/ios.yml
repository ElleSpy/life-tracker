name: iOS build

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Show versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: Build
        run: |
          xcodebuild \
            -project LifeTracker.xcodeproj \
            -scheme LifeTracker \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
